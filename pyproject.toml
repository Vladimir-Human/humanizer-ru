[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humanizer-ru"
dynamic = ["version"]
description = "CLI-сканеры следов машинной генерации русского текста (только stdlib)"
readme = "README.pypi.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Vladimir-Human" },
]
keywords = [
  "russian", "ai-text", "ai-detection", "humanizer", "claude-code",
  "agent-skills", "codex", "cursor", "dsh",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: Russian",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/Vladimir-Human/humanizer-ru"
Documentation = "https://github.com/Vladimir-Human/humanizer-ru/blob/main/README.md"
Changelog = "https://github.com/Vladimir-Human/humanizer-ru/blob/main/CHANGELOG.md"
Tracker = "https://github.com/Vladimir-Human/humanizer-ru/issues"
Releases = "https://github.com/Vladimir-Human/humanizer-ru/releases"

[project.scripts]
humanizer-scan = "humanizer_ru.cli:scan_main"
humanizer-markers = "humanizer_ru.cli:markers_main"
humanizer-polish = "humanizer_ru.cli:polish_main"
humanizer-detect = "humanizer_ru.cli:detect_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "humanizer_ru.__version__" }
