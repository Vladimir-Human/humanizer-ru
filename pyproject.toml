[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humanizer-ru"
dynamic = ["version"]
description = "CLI-сканеры следов машинной генерации русского текста (только stdlib)"
readme = "README.pypi.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Vladimir-Human" },
]
keywords = [
  "russian", "ai-text", "ai-detection", "humanizer", "claude-code",
  "agent-skills", "codex", "cursor", "dsh",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: Russian",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/Vladimir-Human/humanizer-ru"
Documentation = "https://github.com/Vladimir-Human/humanizer-ru/blob/main/README.md"
Changelog = "https://github.com/Vladimir-Human/humanizer-ru/blob/main/CHANGELOG.md"
Tracker = "https://github.com/Vladimir-Human/humanizer-ru/issues"
Releases = "https://github.com/Vladimir-Human/humanizer-ru/releases"

[project.optional-dependencies]
# Словарная морфология (не ML): леммы имён в F1/F2.
# лемматизация — pymorphy3 напрямую (>=2.0.6, версия в lock-заметке
# LICENSES.md); razdel допустим как замороженный сегментатор (MIT,
# ноль зависимостей); natasha/yargy/slovnet НЕ использовать (мертвы
# с 07.2023, тянут pymorphy2) — поправка 49.
ru-morph = ["pymorphy3>=2.0.6", "razdel>=0.5"]

[project.scripts]
humanizer-scan = "humanizer_ru.cli:scan_main"
humanizer-markers = "humanizer_ru.cli:markers_main"
humanizer-polish = "humanizer_ru.cli:polish_main"
humanizer-detect = "humanizer_ru.cli:detect_main"
humanizer-facts = "humanizer_ru.facts_diff:main"
humanizer-mcp = "humanizer_ru.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
humanizer_ru = ["contract.v1.json", "markers.v1.json", "identity.v1.json"]

[tool.setuptools.dynamic]
version = { attr = "humanizer_ru.__version__" }
