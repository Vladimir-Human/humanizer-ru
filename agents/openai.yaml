version: "3.35.0"
name: humanizer-ru
interface:
  display_name: "Humanizer RU"
  short_description: "Проверяемая гигиена вставки из чата для русского текста"
  default_prompt: "Прочитай русскоязычный текст и найди артефакты вставки из чата и следы машинной генерации; объясни каждую находку. Сними поддерживаемые артефакты или перепиши текст только по явной просьбе. Скилл текстовый: только правка текста, без выполнения кода и обращения к сети."
policy:
  allow_implicit_invocation: false
