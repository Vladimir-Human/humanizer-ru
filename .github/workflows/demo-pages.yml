# Публикация браузерного демо на GitHub Pages.
# Источник - каталог demo/, собранный артефактом без сборки: файлы
# статические, текст пользователя не покидает браузер.
name: Демо на GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'llms.txt'
      - 'contract.v1.json'
      - 'identity.v1.json'
      - 'ERRATA.md'
      - 'README.md'
      - 'README.en.md'
      - 'SKILL.md'
      - 'docs/FRAMEWORK.md'
      - 'eval/facts/facts.v1.json'
      - '.github/workflows/demo-pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: Публикация статического демо
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0  # теги нужны write_status для честного лага
      - name: Разрешить SHA деплоя до коммита
        # Для события release github.sha может быть объектом аннотированного
        # тега: статус и приёмка обязаны нести COMMIT деплоя (peeled), а не
        # SHA объекта тега. Для push/dispatch rev-parse идемпотентен.
        id: deploy_sha
        run: echo "sha=$(git rev-parse '${{ github.sha }}^{commit}')" >> "$GITHUB_OUTPUT"
      - name: Настроить Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Добавить машинные файлы к артефакту
        # llms.txt, контракт, эррата и витринные копии доступны по
        # URL-конвенции (/llms.txt, /.well-known/llms.txt, /README.md, ...):
        # копии добавляются только в артефакт Pages, в каталоге demo/
        # репозитория их нет. Состав сверяет гейт scripts/check_pages_router.py.
        run: |
          cp llms.txt contract.v1.json ERRATA.md README.md README.en.md SKILL.md identity.v1.json demo/
          mkdir -p demo/docs demo/eval/facts demo/.well-known
          cp docs/FRAMEWORK.md demo/docs/FRAMEWORK.md
          cp eval/facts/facts.v1.json demo/eval/facts/facts.v1.json
          cp eval/facts/self-audit.v1.json demo/eval/facts/self-audit.v1.json
          cp llms.txt demo/.well-known/llms.txt
      - name: Прогнать тесты и паритет для статуса
        # Утверждения статуса (tests_passed, parity) выводятся из
        # реального прогона для точного SHA деплоя: упавшие тесты или
        # паритет обрывают шаг и блокируют публикацию — статус не
        # публикуется без выполненной проверки.
        run: |
          python3 -m unittest discover -s tests
          python3 scripts/check_demo_parity.py
          printf '{"sha":"%s","tests_passed":true,"parity":"ok"}\n' "${{ steps.deploy_sha.outputs.sha }}" > run-result.json
      - name: Обновить теги перед расчётом статуса
        # Релизный тег может быть запушен за секунды до release-события:
        # раннер способен его ещё не видеть (гонка распространения ref),
        # и status.json публиковал устаревший published_tag (воспроизведено
        # на v3.35.1). Принудительный fetch тегов делает расчёт
        # published_tag/published_commit детерминированным.
        run: git fetch --tags --force origin
      - name: Сгенерировать status.json деплоя
        # Статус собирается из точного SHA деплоя и результата прогона:
        # Pages не может отдать статус чужого коммита, гонка
        # status-коммитов исключена (аудит N4).
        run: python3 scripts/write_status.py --sha ${{ steps.deploy_sha.outputs.sha }} --run-result run-result.json
      - name: Приёмка статуса деплоя
        # Утверждения status.json сверяются с результатом прогона и SHA
        # деплоя (ложное true, чужой SHA и отсутствие результата
        # блокируют публикацию).
        run: python3 scripts/check_release.py --acceptance --status demo/status.json --run-result run-result.json --deploy-sha ${{ steps.deploy_sha.outputs.sha }}
      - name: Собрать артефакт из demo/
        # include-hidden-files: true обязателен: с v4 действие по умолчанию
        # вырезает скрытые пути, и Pages отдаёт 404 на /.well-known/llms.txt
        # (конвенция машинного входа). Голый upload-artifact не подходит:
        # deploy-pages отвергает его артефакт («hard links, symlinks»).
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: demo
          include-hidden-files: true
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Проверить машинный вход на Pages
        # После деплоя: копии и обе конвенции llms.txt отдают 200,
        # ссылки llms.txt разрешаются.
        run: python3 scripts/check_pages_router.py --live-pages
      - name: Браузерная DOM-проверка опубликованного демо
        # Приёмка ОПУБЛИКОВАННОГО URL: подсветка режет исходный текст
        # точно (DOM mark.textContent и срезы), состояния и работа без
        # сети проверены реальным браузером. Честная граница: шаг стоит
        # ПОСЛЕ деплоя и не отменяет уже выполненный deploy — он роняет
        # workflow Pages и блокирует ОБЪЯВЛЕНИЕ поставки проверенной
        # (реестр поставки требует результата этой проверки); публикацию
        # PyPI блокирует отдельная браузерная проверка кандидата в
        # pypi-publish.yml (до необратимых шагов). Браузерная среда —
        # инфраструктура CI, не runtime продукта. UNAVAILABLE (код 2,
        # playwright не поднялся) роняет шаг так же, как FAIL:
        # непроверенное состояние не публикуется как зелёное.
        run: |
          python3 -m pip install --user 'playwright==1.62.0'
          python3 -m playwright install --with-deps chromium
          python3 scripts/check_demo_browser.py --url "${{ steps.deployment.outputs.page_url }}index.html"
