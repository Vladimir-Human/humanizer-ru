# Публикация браузерного демо на GitHub Pages.
# Источник - каталог demo/, собранный артефактом без сборки: файлы
# статические, текст пользователя не покидает браузер.
name: Демо на GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'llms.txt'
      - 'contract.v1.json'
      - 'ERRATA.md'
      - 'README.md'
      - 'README.en.md'
      - 'SKILL.md'
      - 'docs/FRAMEWORK.md'
      - 'eval/facts/facts.v1.json'
      - '.github/workflows/demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: Публикация статического демо
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Настроить Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Добавить машинные файлы к артефакту
        # llms.txt, контракт, эррата и витринные копии доступны по
        # URL-конвенции (/llms.txt, /.well-known/llms.txt, /README.md, ...):
        # копии добавляются только в артефакт Pages, в каталоге demo/
        # репозитория их нет. Состав сверяет гейт scripts/check_pages_router.py.
        run: |
          cp llms.txt contract.v1.json ERRATA.md README.md README.en.md SKILL.md identity.v1.json demo/
          mkdir -p demo/docs demo/eval/facts demo/.well-known
          cp docs/FRAMEWORK.md demo/docs/FRAMEWORK.md
          cp eval/facts/facts.v1.json demo/eval/facts/facts.v1.json
          cp eval/facts/self-audit.v1.json demo/eval/facts/self-audit.v1.json
          cp llms.txt demo/.well-known/llms.txt
      - name: Сгенерировать status.json деплоя
        # Статус собирается из точного SHA деплоя: Pages не может отдать
        # статус чужого коммита, гонка status-коммитов исключена (аудит N4).
        run: python3 scripts/write_status.py --sha ${{ github.sha }}
      - name: Собрать артефакт из demo/
        # include-hidden-files: true обязателен: с v4 действие по умолчанию
        # вырезает скрытые пути, и Pages отдаёт 404 на /.well-known/llms.txt
        # (конвенция машинного входа). Голый upload-artifact не подходит:
        # deploy-pages отвергает его артефакт («hard links, symlinks»).
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: demo
          include-hidden-files: true
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Проверить машинный вход на Pages
        # После деплоя: копии и обе конвенции llms.txt отдают 200,
        # ссылки llms.txt разрешаются.
        run: python3 scripts/check_pages_router.py --live-pages
