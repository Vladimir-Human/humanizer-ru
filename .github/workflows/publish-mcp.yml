name: Публикация в официальный реестр MCP

# Поддерживаемый путь публикации записи реестра
# registry.modelcontextprotocol.io без секретов: GitHub OIDC
# (mcp-publisher login github-oidc) доказывает владение пространством
# имён io.github.Vladimir-Human по месту запуска (Actions этого репо).
# Публикуется server.json из корня: версия и пакет обязаны совпадать с
# опубликованным на PyPI (сверяется scripts/check_live_distribution.py).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Проверяемый annotated тег выпуска'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Публикация server.json в реестр MCP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Выбранный ref — релизный тег и HEAD
        env:
          RELEASE_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          ref = os.environ['RELEASE_REF']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', ref):
              sys.exit(f'недопустимый ref: {ref!r}')
          version = open('src/humanizer_ru/__init__.py', encoding='utf-8').read()
          m = re.search(r'__version__\s*=\s*"(\d+\.\d+\.\d+)"', version)
          if not m or ref[1:] != m.group(1):
              sys.exit(f'ref {ref} не совпадает с версией пакета')
          tag_commit = subprocess.check_output(['git', 'rev-list', '-n', '1', ref], text=True).strip()
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if tag_commit != head:
              sys.exit(f'HEAD {head} не совпадает с commit тега {tag_commit}')
          print('ref/version/HEAD согласованы:', ref, head)
          PY

      - name: Версия server.json равна версии пакета
        run: |
          python3 - <<'PY'
          import json, re, sys
          server = json.load(open("server.json", encoding="utf-8"))
          init = open("src/humanizer_ru/__init__.py", encoding="utf-8").read()
          m = re.search(r'__version__\s*=\s*"(\d+\.\d+\.\d+)"', init)
          if not m:
              sys.exit("версия пакета не читается")
          if server.get("version") != m.group(1):
              sys.exit("server.json version %s != пакет %s"
                       % (server.get("version"), m.group(1)))
          print("версии совпадают:", m.group(1))
          PY

      - name: Контракт релиза до OIDC-публикации
        run: python3 scripts/check_release.py --release-contract

      - name: Установить mcp-publisher
        run: |
          # Пин версии и SHA-256 исключают подмену бинарника через latest.
          # Контрольная сумма взята из checksums релиза registry v1.8.1.
          ASSET="mcp-publisher_linux_amd64.tar.gz"
          URL="https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/$ASSET"
          curl --fail --silent --show-error --location --output mcp-publisher.tar.gz "$URL"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum --check --status
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version

      - name: Аутентификация GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Публикация записи реестра
        run: |
          # Реестр сверяет версию с PyPI и отвечает 400 «Wait and retry»,
          # пока свежая версия не распространится: повторяем до 10 раз.
          for attempt in $(seq 1 10); do
            echo "попытка $attempt"
            if ./mcp-publisher publish --file server.json; then
              exit 0
            fi
            [ "$attempt" -lt 10 ] && sleep 60
          done
          exit 1

      - name: Чтение опубликованной записи
        run: |
          EXPECTED=$(python3 -c 'import json; print(json.load(open("server.json", encoding="utf-8"))["version"])')
          URL="https://registry.modelcontextprotocol.io/v0.1/servers/io.github.Vladimir-Human%2Fhumanizer-ru/versions/latest"
          for attempt in $(seq 1 10); do
            echo "проверка реестра: попытка $attempt"
            if curl --fail --silent --show-error --location "$URL" -o registry.json \
              && EXPECTED="$EXPECTED" python3 -c 'import json, os, sys; d=json.load(open("registry.json", encoding="utf-8")); s=d.get("server") or {}; meta=((d.get("_meta") or {}).get("io.modelcontextprotocol.registry/official") or {}); actual=s.get("version"); expected=os.environ["EXPECTED"]; ok=(s.get("name")=="io.github.Vladimir-Human/humanizer-ru" and actual==expected and (s.get("packages") or [{}])[0].get("version")==expected and meta.get("status")=="active"); print("реестр: версия", actual, "статус", meta.get("status")); sys.exit(0 if ok else 1)'; then
              exit 0
            fi
            [ "$attempt" -lt 10 ] && sleep 30
          done
          echo "реестр не подтвердил опубликованную запись" >&2
          exit 1
