name: Публикация в официальный реестр MCP

# Поддерживаемый путь публикации записи реестра
# registry.modelcontextprotocol.io без секретов: GitHub OIDC
# (mcp-publisher login github-oidc) доказывает владение пространством
# имён io.github.Vladimir-Human по месту запуска (Actions этого репо).
# Публикуется server.json из корня: версия и пакет обязаны совпадать с
# опубликованным на PyPI (сверяется scripts/check_live_distribution.py).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Проверяемый annotated тег выпуска'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-mcp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Публикация server.json в реестр MCP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Версия server.json равна версии пакета
        run: |
          python3 - <<'PY'
          import json, re, sys
          server = json.load(open("server.json", encoding="utf-8"))
          init = open("src/humanizer_ru/__init__.py", encoding="utf-8").read()
          m = re.search(r'__version__\s*=\s*"(\d+\.\d+\.\d+)"', init)
          if not m:
              sys.exit("версия пакета не читается")
          if server.get("version") != m.group(1):
              sys.exit("server.json version %s != пакет %s"
                       % (server.get("version"), m.group(1)))
          print("версии совпадают:", m.group(1))

      - name: Контракт релиза до OIDC-публикации
        run: python3 scripts/check_release.py --release-contract
          PY

      - name: Установить mcp-publisher
        run: |
          # Пин версии и SHA-256 исключают подмену бинарника через latest.
          # Контрольная сумма взята из checksums релиза registry v1.8.1.
          ASSET="mcp-publisher_linux_amd64.tar.gz"
          URL="https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/$ASSET"
          curl --fail --silent --show-error --location --output mcp-publisher.tar.gz "$URL"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum --check --status
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version

      - name: Аутентификация GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Публикация записи реестра
        run: |
          # Реестр сверяет версию с PyPI и отвечает 400 «Wait and retry»,
          # пока свежая версия не распространится: повторяем до 10 раз.
          for attempt in $(seq 1 10); do
            echo "попытка $attempt"
            if ./mcp-publisher publish --file server.json; then
              exit 0
            fi
            [ "$attempt" -lt 10 ] && sleep 60
          done
          exit 1

      - name: Чтение опубликованной записи
        run: |
          sleep 5
          EXPECTED=$(python3 -c 'import json; print(json.load(open("server.json", encoding="utf-8"))["version"])')
          curl --fail --silent --show-error --location \
            "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.Vladimir-Human%2Fhumanizer-ru/versions/latest" \
            | EXPECTED="$EXPECTED" python3 -c 'import json, os, sys; d=json.load(sys.stdin); s=d.get("server") or {}; actual=s.get("version"); expected=os.environ["EXPECTED"]; print("реестр: версия", actual, "статус", ((d.get("_meta") or {}).get("io.modelcontextprotocol.registry/official") or {}).get("status")); sys.exit(0 if actual == expected else "реестр вернул %s, ожидалась %s" % (actual, expected))'
