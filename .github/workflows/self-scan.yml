name: Самопроверка скилла на собственные маркеры

# Скилл проверяет сам себя: все .md, .py и .yml файлы проекта
# прогоняются через check_markers.py --scan. Совпадения внутри
# обратных кавычек (документация выражений) пропускаются автоматически.
# Добавлено в v2.8; кодировка исправлена в v3.3.5. Вендор-копия
# eval/candidates/smixs_lint_pinned.py исключена по тому же принципу,
# что scripts/check_markers.py, tests/fixtures и пакетные копии
# src/humanizer_ru/{check_markers,scan_soft_signals}.py: файлы
# содержат свои фикстуры и выражения с маркерами по построению.
# check_compatibility.py, check_mcp.py, scripts/mcp/* и пакетные копии
# mcp_server.py и text_layer.py исключены с v3.17.0/v3.18.0 по тому же принципу: их
# пробники и selftest несут образцы маркированного текста намеренно
# (матрица совместимости и conformance-сессия MCP).

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '**.py'
      - '**.yml'
  pull_request:
    paths:
      - '**.md'
      - '**.py'
      - '**.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-scan:
    name: Проверка на маркеры в собственном тексте
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Прогнать --scan по всем файлам проекта
        run: |
          find . -type f \( -name '*.md' -o -name '*.py' -o -name '*.yml' \) \
            ! -path './.git/*' ! -path './node_modules/*' \
            ! -path './dsh/skills/*' \
            ! -path './scripts/check_markers.py' \
            ! -path './scripts/check_fixture_sources.py' \
            ! -path './scripts/check_corpus.py' \
            ! -path './scripts/check_compatibility.py' \
            ! -path './scripts/check_mcp.py' \
            ! -path './scripts/mcp/*' \
            ! -path './scripts/filemarks/text_layer.py' \
            ! -path './scripts/filemarks/filemarks.py' \
            ! -path './scripts/action_fix.py' \
            ! -path './.github/workflows/action-smoke.yml' \
            ! -path './eval/candidates/smixs_lint_pinned.py' \
            ! -path './references/test-fixtures*.md' \
            ! -path './references/false-positives.md' \
            ! -path './references/chatbot-artifacts*.md' \
            ! -path './research/fixtures/*' \
            ! -path './research/archive/releases/*' \
            ! -path './research/archive/experiments/*' \
            ! -path './research/CONSILIUM-REPORT.md' \
            ! -path './tests/fixtures/*' \
            ! -path './tests/*' \
            ! -path './src/humanizer_ru/check_markers.py' \
            ! -path './src/humanizer_ru/scan_soft_signals.py' \
            ! -path './src/humanizer_ru/text_layer.py' \
            ! -path './src/humanizer_ru/mcp_server.py' \
            ! -path './research/ab/*' \
            ! -path './research/raw/*' \
            ! -path './research/*prereg*' \
            -exec python3 scripts/check_markers.py --scan {} +
