name: Согласованность документации

# Закрывает пробел v3.3.3: README устаревал молча (версии, дерево проекта,
# дубль истории), сырые файлы смешивались с аналитикой, вердикты журналов
# не были связаны с фактическим числом прогонов. Теперь это ловит CI.

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'CITATION.cff'
      - 'scripts/check_docs.py'
      - 'scripts/check_own_style.py'
      - 'scripts/check_reference_maps.py'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - '**.md'
      - 'CITATION.cff'
      - 'scripts/check_docs.py'
      - 'scripts/check_own_style.py'
      - 'scripts/check_reference_maps.py'
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Проверка документации
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Самопроверка валидатора
        run: python3 scripts/check_docs.py --selftest
      - name: Проверка репозитория
        run: python3 scripts/check_docs.py
      - name: Самопроверка порога стиля
        run: python3 scripts/check_own_style.py --selftest
      - name: Порог стиля на собственные файлы
        run: python3 scripts/check_own_style.py
      - name: Самопроверка карт справочников
        run: python3 scripts/check_reference_maps.py --selftest
      - name: Карты разбитых справочников
        run: python3 scripts/check_reference_maps.py
