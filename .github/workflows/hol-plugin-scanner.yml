name: HOL plugin scanner

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hol-plugin-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Plugin scanner baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify with HOL Plugin Scanner
        # HOL's scanner is an external advisory surface. Keep its report
        # visible while product CI remains governed by repository gates.
        continue-on-error: true
        uses: hashgraph-online/ai-plugin-scanner-action@bb4f519048c0fd1cd9d7b42056072d6070b8ad7d # v1.2.651
        with:
          mode: verify
          plugin_dir: "."
          format: text
          output: plugin-scanner-report.txt
          min_score: 80
          fail_on_severity: high
      - name: Upload scanner report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hol-plugin-scanner-report
          path: plugin-scanner-report.txt
          if-no-files-found: ignore
