name: Валидаторы спецификации и реестра

# Закрывает пробел v3.3.0: check_spec.py и check_fixture_sources.py
# запускались только вручную. Теперь оба валидатора — в CI.

on:
  push:
    branches: [main]
    paths:
      - 'SKILL.md'
      - 'scripts/**'
      - 'references/**'
      - 'research/fixtures/**'
      - 'research/validation/**'
      - 'tests/fixtures/**'
      - '.github/workflows/validators.yml'
  pull_request:
    paths:
      - 'SKILL.md'
      - 'scripts/**'
      - 'references/**'
      - 'research/fixtures/**'
      - 'research/validation/**'
      - 'tests/fixtures/**'
      - '.github/workflows/validators.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec:
    name: SKILL.md соответствует спецификации Agent Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Самопроверка валидатора
        run: python3 scripts/check_spec.py --selftest
      - name: Строгая проверка SKILL.md
        run: python3 scripts/check_spec.py SKILL.md --strict --expect-dir humanizer-ru

  fixture-sources:
    name: Реестр источников маркеров
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Самопроверка валидатора
        run: python3 scripts/check_fixture_sources.py --selftest
      - name: Гейт доказательств для зарегистрированных маркеров (14/14)
        run: python3 scripts/check_fixture_sources.py research/fixtures/marker-sources.json

  parity:
    name: md↔py паритет regex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Каждое выражение CASES задокументировано в chatbot-artifacts.md
        run: python3 scripts/check_markers.py --parity

  style-selftest:
    name: Самопроверка стилевых маркеров
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: count_style_markers --selftest
        run: python3 scripts/count_style_markers.py --selftest

  corpus:
    name: Регрессия корпусов валидации
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Human 0, raw только BOM, boundary совпал
        run: python3 scripts/check_corpus.py
