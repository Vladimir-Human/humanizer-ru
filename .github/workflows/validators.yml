name: Валидаторы спецификации и реестра

# Закрывает пробел v3.3.0: check_spec.py и check_fixture_sources.py
# запускались только вручную. Теперь оба валидатора — в CI.

on:
  push:
    branches: [main]
    paths:
      - 'SKILL.md'
      - 'README.md'
      - 'README.en.md'
      - 'scripts/**'
      - 'references/**'
      - 'research/fixtures/**'
      - 'research/validation/**'
      - 'tests/fixtures/**'
      - '.github/workflows/validators.yml'
  pull_request:
    paths:
      - 'SKILL.md'
      - 'README.md'
      - 'README.en.md'
      - 'scripts/**'
      - 'references/**'
      - 'research/fixtures/**'
      - 'research/validation/**'
      - 'tests/fixtures/**'
      - '.github/workflows/validators.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec:
    name: SKILL.md соответствует спецификации Agent Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Самопроверка валидатора
        run: python3 scripts/check_spec.py --selftest
      - name: Строгая проверка SKILL.md
        run: python3 scripts/check_spec.py SKILL.md --strict --expect-dir humanizer-ru

  fixture-sources:
    name: Реестр источников маркеров
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Самопроверка валидатора
        run: python3 scripts/check_fixture_sources.py --selftest
      - name: Гейт доказательств для зарегистрированных маркеров (14/14)
        run: python3 scripts/check_fixture_sources.py research/fixtures/marker-sources.json

  parity:
    name: md↔py паритет regex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Каждое выражение CASES задокументировано в chatbot-artifacts.md
        run: python3 scripts/check_markers.py --parity

  style-selftest:
    name: Самопроверка стилевых маркеров
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: count_style_markers --selftest
        run: python3 scripts/count_style_markers.py --selftest

  corpus:
    name: Регрессия корпусов валидации
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Human 0, raw только BOM, boundary совпал
        run: python3 scripts/check_corpus.py

  examples:
    name: Честность примеров До/После
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Самопроверка валидатора
        run: python3 scripts/check_examples.py --selftest
      - name: Правка не дописывает факты за автора
        run: python3 scripts/check_examples.py

  budget:
    name: Бюджет контекста по спецификации
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Самопроверка валидатора
        run: python3 scripts/check_budget.py --selftest
      - name: Лимиты name / description / compatibility и размер SKILL.md
        run: python3 scripts/check_budget.py SKILL.md --expect-dir humanizer-ru

  eval-harness:
    name: Нейтральный eval-корпус
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Прогон manifest.v1.json
        run: python3 eval/run_eval.py

  release-preflight:
    name: Самопроверка сборки архива
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check_release.py --selftest
        run: python3 scripts/check_release.py --selftest
      - name: Сборка + верификация архива (allowlist, без research/tests/.github)
        run: |
          python3 scripts/check_release.py --root . --build dist/humanizer-ru.zip
          python3 scripts/check_release.py --verify dist/humanizer-ru.zip
