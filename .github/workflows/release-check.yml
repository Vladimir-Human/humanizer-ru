name: Проверка релиза

# Срабатывает при создании тегов vX.Y.Z. Кодифицирует ручной чек-лист
# FINAL-PREMERGE-REPORT: тег должен быть annotated, версия тега должна
# совпадать с metadata SKILL.md, а CHANGELOG должен содержать запись.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # перезапуск контракт-гейта после публикации Release:
                       # гонка «тег раньше Release» не требует пересоздания тега
    inputs:
      tag:
        description: 'Проверяемый annotated тег выпуска'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-check:
    name: Тег соответствует релизному контракту
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Установить build
        # Гейты pypi-metadata и sdist-теста в --strict обязаны выполняться,
        # а не SKIP: без модуля build они не проверены и блокируют прогон.
        run: python3 -m pip install --user 'build==1.5.0'

      - name: Релизный тег из checkout
        id: tag
        run: |
          T="${{ inputs.tag || github.ref_name }}"
          [[ "$T" == v* ]] || { echo "FAIL: нужен тег vX.Y.Z, получено $T"; exit 1; }
          echo "value=$T" >> "$GITHUB_OUTPUT"
          echo "проверяемый тег: $T"

      - name: Тег annotated (не lightweight)
        run: |
          TAGREF="${{ steps.tag.outputs.value }}"
          TYPE=$(git cat-file -t "$TAGREF" 2>/dev/null || echo "")
          if [ "$TYPE" != "tag" ]; then
            echo "FAIL: тег $TAGREF не annotated ($TYPE)"
            exit 1
          fi
          echo "OK: annotated tag $TAGREF"

      - name: Версия тега == version в SKILL.md metadata
        run: |
          TAGREF="${{ steps.tag.outputs.value }}"
          TAG="${TAGREF#v}"
          META=$(grep -oP 'version:\s*"?\K\d+\.\d+\.\d+' SKILL.md | head -1)
          echo "tag=$TAG meta=$META"
          [ "$TAG" = "$META" ] || { echo "FAIL: тег $TAG != metadata $META"; exit 1; }

      - name: CHANGELOG содержит запись для версии
        run: |
          TAGREF="${{ steps.tag.outputs.value }}"
          TAG="${TAGREF#v}"
          grep -qE "^##\s+${TAG}\b" CHANGELOG.md || {
            echo "FAIL: в CHANGELOG.md нет записи ## ${TAG}"
            exit 1
          }

      - name: Финальный прогон всех валидаторов
        run: |
          # Полный релизный чек-лист одной командой: 155 гейтов, включая
          # pkg-sync, confidence, facts, polish, conj, selfattack, contract, markers-export, adversarial, filemarks, release-contract.
          # Режим --strict: без FAIL и без непроверенных SKIP.
          # Заменяет рукописный список: ручной перечень
          # отставал от check_all.py и пропускал гейты, добавленные позже.
          python3 scripts/check_all.py --strict
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q scripts eval

      - name: Сборка и верификация детерминированного архива скилла
        run: |
          python3 scripts/check_release.py --root . --build dist/humanizer-ru.zip
          python3 scripts/check_release.py --verify dist/humanizer-ru.zip
          sha256sum dist/humanizer-ru.zip

      - name: "Контракт выпуска: подпись тега и криптопроверка"
        run: |
          # Подпись проверяется опубликованным ключом проекта во временной
          # связке (docs/release-signing-key.asc); отсутствие ключа,
          # неверная подпись и подпись не тем ключом различаются.
          python3 scripts/check_release.py --release-contract

      - name: Приложить архив к прогону
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: humanizer-ru-zip
          path: dist/humanizer-ru.zip
          if-no-files-found: error
