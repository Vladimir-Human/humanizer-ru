# Публикация на PyPI через Trusted Publishing (PEP 740).
#
# Без долгоживущего API-токена: GitHub выдаёт OIDC-токен (id-token: write),
# PyPI проверяет его по доверенному издателю. Требуется ОДНОРАЗОВАЯ настройка
# на стороне PyPI (web-UI проекта humanizer-ru: Trusted publishers →
# GitHub Actions, owner Vladimir-Human, repo humanizer-ru, workflow
# pypi-publish.yml, environment pypi). До настройки загрузка завершится 403;
# в этом случае публикация выполняется вручную twine с раскрытием в нотах
# выпуска (как для 3.16.9/3.16.10).
#
# Аттестаты PEP 740 (provenance) генерируются действием публикации.
name: Публикация на PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Проверяемый annotated тег выпуска'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Сборка и чистое venv
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0   # гейты git-depth и attribution требуют полную историю
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Выбранный ref — релизный тег и HEAD
        env:
          RELEASE_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          ref = os.environ['RELEASE_REF']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', ref):
              sys.exit(f'недопустимый ref: {ref!r}')
          version = open('src/humanizer_ru/__init__.py', encoding='utf-8').read()
          m = re.search(r'__version__\s*=\s*"(\d+\.\d+\.\d+)"', version)
          if not m or ref[1:] != m.group(1):
              sys.exit(f'ref {ref} не совпадает с версией пакета')
          tag_commit = subprocess.check_output(['git', 'rev-list', '-n', '1', ref], text=True).strip()
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if tag_commit != head:
              sys.exit(f'HEAD {head} не совпадает с commit тега {tag_commit}')
          print('ref/version/HEAD согласованы:', ref, head)
          PY

      - name: Установить build
        run: python3 -m pip install --user 'build==1.5.0'

      - name: Собрать sdist и wheel
        run: python3 -m build

      - name: Metadata публикуемых артефактов
        # Приёмка выпуска: metadata сверяются у ТЕХ ЖЕ dist-файлов, которые
        # уйдут на PyPI; ненулевой код блокирует публикацию (аудит N47).
        run: python3 scripts/check_pypi_metadata.py --sdist dist/humanizer_ru-*.tar.gz --wheel dist/humanizer_ru-*.whl

      - name: sdist -> чистое venv -> тесты + CLI-зонды
        run: python3 scripts/check_release.py --sdist-test dist/humanizer_ru-*.tar.gz

      - name: Установленные пользовательские сценарии на wheel и sdist (без skips)
        # Приёмка публикации: сценарии установленной поставки исполняются
        # для ОБОИХ публикуемых артефактов в чистых venv; отсутствие
        # подготовленного окружения или пропуск обязательного сценария —
        # ошибка публикации (код 1), а не успешный skip. Проверяются
        # реальные console entry points и MCP-сессия установленных данных.
        run: |
          python3 -m venv /tmp/journeys-wheel
          /tmp/journeys-wheel/bin/python -m pip install --quiet dist/humanizer_ru-*.whl
          HUMANIZER_JOURNEY_PYTHON=/tmp/journeys-wheel/bin/python python3 scripts/run_journeys_strict.py
          python3 -m venv /tmp/journeys-sdist
          /tmp/journeys-sdist/bin/python -m pip install --quiet dist/humanizer_ru-*.tar.gz
          HUMANIZER_JOURNEY_PYTHON=/tmp/journeys-sdist/bin/python python3 scripts/run_journeys_strict.py

      - name: Полный строгий прогон валидаторов поставляемого дерева
        # Публикация неотделима от подтверждённого прогона: --strict
        # блокирует любой FAIL и любой непроверенный SKIP.
        run: |
          python3 scripts/check_all.py --strict
          python3 -m unittest discover -s tests

      - name: Факты и совместимость с опубликованной версией
        run: |
          python3 scripts/check_facts.py --strict-publication
          python3 scripts/check_compatibility.py

      - name: Браузерная DOM-проверка демо кандидата до публикации
        # Проверка КАНДИДАТА блокирует публикацию (исполняется в
        # build-and-test до артефакта). Проверка опубликованного URL
        # живёт в demo-pages.yml: она не отменяет выполненный deploy,
        # но роняет workflow Pages и блокирует объявление поставки
        # проверенной. Браузерная среда — инфраструктура CI, не runtime
        # продукта (stdlib-only поставка не меняется).
        run: |
          python3 -m pip install --quiet 'playwright==1.62.0'
          python3 -m playwright install --with-deps chromium
          python3 -m http.server 8478 --directory demo &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          python3 scripts/check_demo_browser.py --url http://localhost:8478/index.html

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pypi-dist
          path: dist/

  publish:
    name: Публикация (Trusted Publishing)
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write   # OIDC-токен для PyPI (PEP 740), вместо API-ключа
    environment: pypi
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        # Аттестаты provenance включены в действии по умолчанию.
        # skip-existing: повторная публикация той же версии пропускается
        # (защита от двойной загрузки и возможность сухого прогона
        # workflow_dispatch для проверки OIDC/доверенного издателя).
        with:
          skip-existing: true
