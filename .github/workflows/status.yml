name: Статус прогона main

# Обновляет docs/status.json ТОЛЬКО после зелёных тестов и паритета:
# упавший прогон не трогает файл, и демо показывает дату последнего успеха.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Тесты
        run: python3 -m unittest discover -s tests

      - name: Паритет демо и CLI
        run: python3 scripts/check_demo_parity.py

      - name: Записать status.json
        # Самоподдерживающийся цикл status-коммитов снят (аудит N4):
        # статус живёт артефактом прогона, а для Pages генерируется в
        # demo-pages.yml из точного SHA деплоя. Утверждения tests_passed
        # и parity выводятся из результата этого прогона (шаги выше
        # блокирующие), приёмка сверяет статус с результатом и SHA.
        run: |
          printf '{"sha":"%s","tests_passed":true,"parity":"ok"}\n' "${{ github.sha }}" > run-result.json
          python3 scripts/write_status.py --sha ${{ github.sha }} --run-result run-result.json
          python3 scripts/check_release.py --acceptance --status docs/status.json --run-result run-result.json --deploy-sha ${{ github.sha }}

      - name: Артефакт status.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: status-json
          path: |
            docs/status.json
            demo/status.json
