name: Статус прогона main

# Обновляет docs/status.json ТОЛЬКО после зелёных тестов и паритета:
# упавший прогон не трогает файл, и демо показывает дату последнего успеха.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@47ecd47e2fbf4fafad304486e7d61a2bdf3a8aa8 # v6
        with:
          python-version: "3.11"

      - name: Тесты
        run: python -m unittest discover -s tests

      - name: Паритет демо и CLI
        run: python scripts/check_demo_parity.py

      - name: Записать status.json
        run: python scripts/write_status.py

      - name: Опубликовать status.json
        run: |
          git config user.name "humanizer-ru-ci"
          git config user.email "humanizer-ru-ci@users.noreply.github.com"
          git add docs/status.json demo/status.json
          if git diff --cached --quiet; then
            echo "status.json без изменений"
          else
            git commit -m "ci: статус прогона main [skip ci]"
            git push
          fi
