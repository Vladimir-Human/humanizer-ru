name: Статус прогона main

# Обновляет docs/status.json ТОЛЬКО после зелёных тестов и паритета:
# упавший прогон не трогает файл, и демо показывает дату последнего успеха.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Тесты
        run: python3 -m unittest discover -s tests

      - name: Паритет демо и CLI
        run: python3 scripts/check_demo_parity.py

      - name: Записать status.json
        # Самоподдерживающийся цикл status-коммитов снят (аудит N4):
        # статус живёт артефактом прогона, а для Pages генерируется в
        # demo-pages.yml из точного SHA деплоя.
        run: python3 scripts/write_status.py --sha ${{ github.sha }}

      - name: Артефакт status.json
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b45822a43468149 # v4
        with:
          name: status-json
          path: |
            docs/status.json
            demo/status.json
