name: Ложное срабатывание (false positive)
description: Живой человеческий текст, который скилл посчитал машинным или испортил при правке
title: "[FP] <коротко, какой паттерн/маркер и на каком тексте>"
labels: ["area/markers", "false-positive"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за находку! Принцип проекта: **ложное срабатывание дороже
        пропуска** — ваш отчёт напрямую улучшает границы детекторов.
        Проверим по шагам ниже.

  - type: dropdown
    id: layer
    attributes:
      label: Что сработало
      options:
        - Regex-маркер (check_markers / humanizer-markers) — класс A
        - Regex-маркер — класс B (предупреждение)
        - Мягкий признак (scan_soft_signals / humanizer-scan)
        - Правка текста испортила живой фрагмент
        - Другое
    validations:
      required: true

  - type: textarea
    id: fragment
    attributes:
      label: Фрагмент текста (дословно)
      description: |
        1–3 предложения, на которых сработало. Если текст не ваш — только
        публично цитируемый фрагмент. Для невидимых маркеров вставьте
        вывод `python scripts/check_markers.py --scan файл.md`.
      placeholder: "Вставьте фрагмент сюда"
    validations:
      required: true

  - type: input
    id: marker
    attributes:
      label: Какой маркер/паттерн назван в выводе
      placeholder: "например: invisible_layout, #13 правило трёх, zero_width"

  - type: textarea
    id: why-human
    attributes:
      label: Почему это живой текст
      description: Автор, год, источник или жанровое обоснование (научный регистр, художественная проза, этикетка с «Без сахара»…).
      placeholder: "Например: цитата из письма Чехова 1887 года / маркировка продукта"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Версия скилла
      description: Из шапки SKILL.md (например 3.15.0) или тег GitHub Action.
      placeholder: "3.15.0"

  - type: checkboxes
    id: checks
    attributes:
      label: Проверки
      options:
        - label: Текст на русском (скилл не предназначен для других языков)
          required: true
        - label: Фрагмент не является кодом/конфигом/логом
          required: true
