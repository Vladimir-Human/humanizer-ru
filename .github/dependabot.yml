# Обновление версий GitHub Actions. Скилл не имеет зависимостей Python:
# все валидаторы используют только стандартную библиотеку.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
  # npm-поверхность бандла dsh/ (dsh/package.json). Runtime-зависимостей
  # у бандла нет; поверхность объявлена, чтобы будущие зависимости не
  # оказались вне обновлений.
  - package-ecosystem: "npm"
    directory: "/dsh"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
